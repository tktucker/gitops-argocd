apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollouts-demo
  labels:
    app: rollouts-demo
  annotations:
    # This annotation tells ArgoCD Notifications where to send alerts
    notifications.argoproj.io/subscribe.on-deployed.slack: my-slack-channel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rollouts-demo
  template:
    metadata:
      labels:
        app: rollouts-demo
    spec:
      containers:
      - name: rollouts-demo
        image: argoproj/rollouts-demo:blue
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: rollouts-demo-service
spec:
  type: NodePort
  selector:
    app: rollouts-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080 # You can let K8s pick one or specify (30000-32767)
