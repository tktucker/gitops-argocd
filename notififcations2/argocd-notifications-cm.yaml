apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # 1. Define the Service (Your Slack token)
  service.slack: |
    token: $slack-token 

  # 2. Define the Triggers (THIS WAS MISSING)
  # These names must match what you use in your Application annotations
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [rollout-status] # References the template below
  
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [rollout-status]

  # 3. Define the Template (What the message looks like)
  template.rollout-status: |
    slack:
      attachments: |
        [{
          "title": "{{ .app.metadata.name }} is {{ .app.status.sync.status }}",
          "color": "{{ if eq .app.status.sync.status "Synced" }}#36a64f{{ else }}#ff0000{{ end }}",
          "fields": [
            {"title": "Repository", "value": "{{ .app.spec.source.repoURL }}", "short": true},
            {"title": "Operation Phase", "value": "{{ .app.status.operationState.phase }}", "short": true}
          ]
        }]
